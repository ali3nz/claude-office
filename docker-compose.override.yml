services:
  claude-office:
    ports: !override
      - "127.0.0.1:8001:8000"
    volumes: !override
      - co-office-db:/app/data
      - ./data/claude-ro:/claude-data:ro
    environment:
      - SUMMARY_ENABLED=${SUMMARY_ENABLED:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  co-office-db:
    name: co-office-db
