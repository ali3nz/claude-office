services:
  claude-office:
    ports: !override
      - "192.168.1.240:8001:8000"
    volumes: !override
      - co-office-db:/app/data
      - ./data/claude-ro:/claude-data:ro
    environment:
      - SUMMARY_ENABLED=${SUMMARY_ENABLED:-false}
      - CLAUDE_OFFICE_ALLOW_CIDR=${CLAUDE_OFFICE_ALLOW_CIDR:-192.168.1.0/24,192.168.208.0/20}
      - CLAUDE_OFFICE_API_KEY=${CLAUDE_OFFICE_API_KEY}
      - CLAUDE_OFFICE_INGEST_KEY=${CLAUDE_OFFICE_INGEST_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  co-office-db:
    name: co-office-db
